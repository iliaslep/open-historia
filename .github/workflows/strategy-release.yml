name: Strategy Windows download

on:
  push:
    branches:
      - release/strategy-delivery

permissions:
  contents: write

concurrency:
  group: strategy-v0.3.0-release
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      # Build the exact reviewed game version, not the delivery branch's tip.
      - uses: actions/checkout@v5
        with:
          ref: strategy-v0.3.0

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      - name: Build Windows game
        run: npm run build:strategy:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Check authentication and callback regressions on Windows
        run: node --test server/chatgptPlan.test.js server/chatgptResponse.test.js server/strategyChat.test.js server/simulationPersistence.test.js server/serverImports.test.js server/strategy.test.js server/society.test.js server/intelligence.test.js server/recommendations.test.js src/simulation/time.test.js

      - name: Check real Electron networking and interrupted streams
        run: |
          node node_modules/electron/install.js
          node node_modules/electron/cli.js scripts/check-strategy-network.cjs
          node -e "if(!require('./release/native-network-check.json').passed)process.exit(1)"

      - name: Package game and corresponding source
        run: |
          node scripts/package-strategy.mjs
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import {createHash} from 'node:crypto';
          const names = ['Open-Historia-Strategy-0.3.0-Windows-x64.zip', 'Open-Historia-Strategy-0.3.0-Source.zip'];
          const lines = names.map(name => `${createHash('sha256').update(fs.readFileSync(`release/${name}`)).digest('hex')}  ${name}`);
          fs.writeFileSync('release/SHA256SUMS.txt', lines.join('\n') + '\n');
          JS

      - name: Attach files and publish the authorized prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release upload strategy-v0.3.0 release/Open-Historia-Strategy-0.3.0-Windows-x64.zip release/Open-Historia-Strategy-0.3.0-Source.zip release/SHA256SUMS.txt release/native-network-check.json PLAY_WINDOWS_RU.md --clobber
          gh release edit strategy-v0.3.0 --draft=false --prerelease --latest=false
